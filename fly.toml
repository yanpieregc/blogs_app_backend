# fly.toml app configuration file generated for app-blog-list on 2026-07-01T16:36:01-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'app-blog-list'
primary_region = 'gru'

[build]

[env]
  PORT = "3003" 

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
